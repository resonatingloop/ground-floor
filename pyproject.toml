[project]
name = "ground-floor"
version = "0.1.0"
description = "trace warrant crossings in multi-agent event ledgers"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "resonatingloop" }]
dependencies = []

[project.scripts]
ground-floor = "ground_floor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ground_floor*"]
